<!doctype html>

<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  />

  <title>과제 모음</title>


  <style>

    html,
    body {

      height: 100%;
      margin: 0;

      overflow: hidden;
      overscroll-behavior: none;

      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;

      font-family: sans-serif;

    }


    /* 목록은 화면 위로 미끄러져 나오는 서랍이라, 과제 화면 크기를 줄이지 않습니다. */
    #menu {

      position: fixed;

      top: 0;
      left: 0;

      width: 140px;
      height: 100%;

      padding: 20px;

      box-sizing: border-box;

      background: #ffffff;

      box-shadow: 4px 0 16px #0004;

      transform: translateX(-100%);

      transition: transform 0.25s ease;

      z-index: 10;

    }


    body.menu-open #menu {

      transform: translateX(0);

    }


    /* 왼쪽 가장자리에 붙은 탭: 누르면 목록이 열리고 닫힙니다. */
    #menu-tab {

      position: fixed;

      top: 20px;
      left: 0;

      width: 28px;
      height: 44px;

      padding: 0;

      border: 0;
      border-radius: 0 6px 6px 0;

      background: #ffffff;

      color: #121212;

      font-size: 16px;

      cursor: pointer;

      opacity: 0.6;

      transition: left 0.25s ease, opacity 0.15s ease;

      z-index: 11;

    }


    #menu-tab:hover,
    #menu-tab:focus-visible,
    body.menu-open #menu-tab {

      opacity: 1;

    }


    body.menu-open #menu-tab {

      left: 140px;

    }


    #menu a {

      display: block;

      margin-bottom: 10px;

      cursor: pointer;

      color: blue;

      text-decoration: underline;

    }


    #stage {

      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      overflow: hidden;

    }


    #viewer {

      display: block;

      width: 100%;
      height: 100%;

      border: 0;

    }


    /* 13_dicememo는 브라우저 90% 확대/축소와 같은 화면으로 보여줍니다.
       아이프레임을 1/0.9배 크기로 만든 뒤 0.9배로 줄여, 화면은 꽉 채우고 글자·요소 크기만 90%가 됩니다. */
    #stage.is-zoom-90 #viewer {

      width: calc(100% / 0.9);
      height: calc(100% / 0.9);

      transform: scale(0.9);
      transform-origin: 0 0;

    }

  </style>

</head>


<body>


  <button
    id="menu-tab"
    type="button"
    aria-controls="menu"
    aria-expanded="false"
    aria-label="과제 목록 열기"
    onclick="toggleMenu()">
    ☰
  </button>


  <div id="menu">

    <a onclick="loadHomework('dynamic-balance')">
      Homework1
    </a>

    <a onclick="loadHomework('Delete-Delete-Delete')">
      Homework2
    </a>

    <a onclick="loadHomework('13_dicememo')">
      Homework3
    </a>

  </div>


  <div id="stage">

    <iframe
      id="viewer"
      src="dynamic-balance/index.html">
    </iframe>

  </div>


  <script>

    function loadHomework(folderName) {

      document.getElementById("viewer").src =
        "./" + folderName + "/index.html";

      document.getElementById("stage").classList.toggle("is-zoom-90", folderName === "13_dicememo");

      toggleMenu(false);

    }


    function toggleMenu(open = !document.body.classList.contains("menu-open")) {

      document.body.classList.toggle("menu-open", open);

      const tab = document.getElementById("menu-tab");

      tab.setAttribute("aria-expanded", String(open));
      tab.setAttribute("aria-label", open ? "과제 목록 닫기" : "과제 목록 열기");
      tab.textContent = open ? "×" : "☰";

    }

  </script>


</body>

</html>
