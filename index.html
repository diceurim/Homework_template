<!doctype html>

<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
  />

  <title>과제 모음</title>


  <style>

    html,
    body {

      height: 100%;
      margin: 0;

      overflow: hidden;
      overscroll-behavior: none;

      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;

      font-family: sans-serif;

    }


    #menu {

      position: fixed;

      top: 0;
      left: 0;

      width: 100px;
      height: 100%;

      padding: 20px;

      box-sizing: border-box;

      background: #ffffff;

      z-index: 10;

    }


    #menu a {

      display: block;

      margin-bottom: 10px;

      cursor: pointer;

      color: blue;

      text-decoration: underline;

    }


    #stage {

      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 100px;

      overflow: hidden;

    }


    #viewer {

      display: block;

      width: 100%;
      height: 100%;

      border: 0;

    }

  </style>

</head>


<body>


  <div id="menu">

    <a onclick="loadHomework('dynamic-balance')">
      Homework1
    </a>

    <a onclick="loadHomework('delete-delete-delete')">
      Homework2
    </a>

    <a onclick="loadHomework('Homework3')">
      Homework3
    </a>

  </div>


  <div id="stage">

    <iframe
      id="viewer"
      src="dynamic-balance/index.html">
    </iframe>

  </div>


  <script>

    function loadHomework(folderName) {

      document.getElementById("viewer").src =
        "./" + folderName + "/index.html";

    }

  </script>


</body>

</html>
